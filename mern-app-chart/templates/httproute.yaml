{{- if .Values.gateway.enabled -}}
{{- $fullName := include "mern-app-chart.fullname" . -}}
{{- $svcPort := .Values.frontend.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "mern-app-chart.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: {{ $svcPort }}
          weight: 1
{{- end }}
