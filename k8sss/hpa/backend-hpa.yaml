# Phase 14: Horizontal Pod Autoscaler
#
# Prerequisite - install the Metrics Server (Kind doesn't ship it by default):
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Kind's metrics-server needs --kubelet-insecure-tls since Kind nodes use self-signed certs.
# After applying the manifest above, patch it:
#   kubectl patch deployment metrics-server -n kube-system --type='json' \
#     -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#
# Verify metrics are flowing before applying this HPA:
#   kubectl top pods -n mern
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: mern
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0

# Generate load to watch it scale, e.g.:
#   hey -z 2m -c 50 -H "Authorization: Bearer <token>" http://localhost/api/items
#   kubectl get hpa -n mern -w
