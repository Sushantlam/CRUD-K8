# DO NOT commit real secrets to git. This is a template.
# Prefer creating it imperatively instead:
#   kubectl create secret generic backend-secret -n mern \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32)
#
# stringData lets you write plain text here; Kubernetes base64-encodes it for you.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: mern
type: Opaque
stringData:
  JWT_SECRET: "replace_with_a_long_random_string"
  MONGO_USER: ""
  MONGO_PASSWORD: ""
